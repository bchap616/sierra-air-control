<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sierra Air Control</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; min-height: 100vh; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background: #111; color: #fff; display:flex; justify-content:center;
  }
  .app { width:min(100%,520px); padding:24px 18px 40px; }
  h1 { margin:6px 0 4px; text-align:center; font-size:27px; }
  #connection { text-align:center; color:#aaa; margin-bottom:24px; font-weight:600; }
  .card { background:#1d1d1f; border:1px solid #333; border-radius:18px; padding:18px; margin:14px 0; }
  .pressure { text-align:center; font-size:72px; line-height:1; font-weight:800; }
  .pressure span { font-size:22px; font-weight:600; color:#bbb; }
  .caption { text-align:center; color:#999; margin-top:8px; font-size:13px; letter-spacing:1px; }
  button, input {
    width:100%; min-height:58px; border:0; border-radius:14px; font-size:19px; font-weight:700;
  }
  button {
    background:#eee; color:#111;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    cursor: pointer;
  }
  button:active { transform: scale(0.985); opacity: 0.82; }
  button:disabled { opacity:.4; }
  #connect { margin-top:4px; }
  .targetRow { display:flex; gap:10px; align-items:center; }
  input {
    background:#111; color:white; border:1px solid #555; text-align:center; font-size:30px;
  }
  .psiLabel { font-size:20px; color:#bbb; }
  #setTarget { margin-top:12px; }
  .manual { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .manual button { min-height:76px; }
  #stop { margin-top:12px; min-height:66px; background:#d93636; color:white; }
  .status { display:flex; justify-content:space-between; gap:12px; font-size:16px; }
  #statusValue { font-weight:700; text-align:right; }
  .hint { color:#888; text-align:center; font-size:12px; margin-top:12px; line-height:1.4; }
</style>
</head>
<body>
<main class="app">
  <h1>SIERRA AIR CONTROL</h1>
  <div id="connection">● Disconnected</div>

  <button id="connect">CONNECT TO TRUCK</button>

  <section class="card">
    <div class="pressure"><span id="pressure">--</span><span> PSI</span></div>
    <div class="caption">CURRENT PRESSURE</div>
  </section>

  <section class="card">
    <div class="caption" style="margin:0 0 12px">TARGET PRESSURE</div>
    <div class="targetRow">
      <input id="target" type="number" inputmode="decimal" min="0" max="100" step="1" placeholder="50">
      <div class="psiLabel">PSI</div>
    </div>
    <button id="setTarget" disabled>SET PRESSURE</button>
  </section>

  <section class="card">
    <div class="caption" style="margin:0 0 12px">MANUAL CONTROL</div>
    <div class="manual">
      <button id="fill" disabled>HOLD TO FILL</button>
      <button id="dump" disabled>HOLD TO DUMP</button>
    </div>
    <button id="stop" disabled>STOP</button>
    <div class="hint">Fill and Dump only stay active while the button is held.</div>
  </section>

  <section class="card status">
    <span>Status</span><span id="statusValue">DISCONNECTED</span>
  </section>
</main>

<script>
const SERVICE_UUID  = 'b7300001-3f47-4f35-9c77-6a51d7d00001';
const PRESSURE_UUID = 'b7300002-3f47-4f35-9c77-6a51d7d00002';
const COMMAND_UUID  = 'b7300003-3f47-4f35-9c77-6a51d7d00003';
const STATUS_UUID   = 'b7300004-3f47-4f35-9c77-6a51d7d00004';

let device, commandChar;
const $ = id => document.getElementById(id);
const controls = ['setTarget','fill','dump','stop'];

function connectedUI(on) {
  $('connection').textContent = on ? '● Connected' : '● Disconnected';
  $('connect').textContent = on ? 'DISCONNECT' : 'CONNECT TO TRUCK';
  controls.forEach(id => $(id).disabled = !on);
  if (!on) {
    $('pressure').textContent = '--';
    $('statusValue').textContent = 'DISCONNECTED';
  }
}

function decodeValue(event) {
  return new TextDecoder().decode(event.target.value).replace(/\0/g,'').trim();
}

async function sendCommand(cmd) {
  if (!commandChar) return;
  const bytes = new TextEncoder().encode(cmd);
  try {
    if (commandChar.properties.writeWithoutResponse) {
      await commandChar.writeValueWithoutResponse(bytes);
    } else {
      await commandChar.writeValue(bytes);
    }
  } catch (e) {
    $('statusValue').textContent = 'COMMAND ERROR';
    console.error(e);
  }
}

async function connect() {
  if (device?.gatt?.connected) {
    device.gatt.disconnect();
    return;
  }
  try {
    device = await navigator.bluetooth.requestDevice({
      filters: [{ name: 'Sierra Air Control' }],
      optionalServices: [SERVICE_UUID]
    });
    device.addEventListener('gattserverdisconnected', () => {
      commandChar = null;
      connectedUI(false);
    });

    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE_UUID);

    commandChar = await service.getCharacteristic(COMMAND_UUID);
    const pressureChar = await service.getCharacteristic(PRESSURE_UUID);
    const statusChar = await service.getCharacteristic(STATUS_UUID);

    await pressureChar.startNotifications();
    pressureChar.addEventListener('characteristicvaluechanged', e => {
      const value = decodeValue(e);
      const n = Number.parseFloat(value);
      $('pressure').textContent = Number.isFinite(n) ? n.toFixed(1) : value;
    });

    await statusChar.startNotifications();
    statusChar.addEventListener('characteristicvaluechanged', e => {
      $('statusValue').textContent = decodeValue(e) || 'IDLE';
    });

    connectedUI(true);
  } catch (e) {
    console.error(e);
    $('statusValue').textContent = 'CONNECT FAILED';
    connectedUI(false);
  }
}

$('connect').addEventListener('click', connect);

$('setTarget').addEventListener('click', async () => {
  const value = Number.parseFloat($('target').value);
  if (!Number.isFinite(value) || value < 0 || value > 100) {
    alert('Enter a target pressure from 0 to 100 PSI.');
    return;
  }
  await sendCommand('TARGET:' + value);
  $('target').blur();
});

$('stop').addEventListener('click', () => sendCommand('STOP'));

// Press-and-hold controls. Sending OFF on every release/cancel path is intentional.
function holdButton(id, onCommand, offCommand) {
  const b = $(id);
  let active = false;

  const start = async e => {
    e.preventDefault();
    if (b.disabled || active) return;
    active = true;
    if (b.setPointerCapture && e.pointerId !== undefined) {
      try { b.setPointerCapture(e.pointerId); } catch (_) {}
    }
    await sendCommand(onCommand);
  };

  const stop = async e => {
    if (!active) return;
    if (e) e.preventDefault();
    active = false;
    await sendCommand(offCommand);
  };

  b.addEventListener('pointerdown', start);
  b.addEventListener('pointerup', stop);
  b.addEventListener('pointercancel', stop);
  b.addEventListener('lostpointercapture', stop);
}

holdButton('fill', 'COMPRESSOR_ON', 'COMPRESSOR_OFF');
holdButton('dump', 'DUMP_ON', 'DUMP_OFF');

connectedUI(false);
</script>
</body>
</html>
